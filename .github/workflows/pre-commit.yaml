name: Pre-commit Check

on:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      config:
        description: 'Path to the pre-commit config file.'
        type: string
        default: '.pre-commit-config.yaml'

env:
  PRE_COMMIT_CONFIG: ${{ inputs.config || '.pre-commit-config.yaml' }}

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: |
            --all-files -c "$PRE_COMMIT_CONFIG"
