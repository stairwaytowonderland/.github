name: CI Package Update

on:
  workflow_call:
    inputs:
      paths:
        description: 'A newline delimited list of file paths to check for changes (e.g. package.json and package-lock.json).'
        type: string
        default: |
          package.json
          package-lock.json
      ignore-authors:
        description: 'A newline delimited list of commit authors to ignore when checking for changes (e.g. semantic-release-bot and github-actions[bot]).'
        type: string
        default: |
          github-actions[bot]
          semantic-release-bot
      ignore-events:
        description: 'A newline delimited list of GitHub events to ignore when checking for changes (e.g. push).'
        type: string
        default: |
          push
      # action-ref:
      #   description: 'Git ref of the shared actions repo to use (e.g. main or a specific tag/commit)'
      #   type: string
      #   default: ''
    secrets:
      github-token:
        description: 'GitHub Personal Access Token with repo scope for checking commits.'

    # outputs:
    #   trigger-update:
    #     description: 'Indicates whether package update would be triggered'
    #     value: ${{ jobs.check-changed.outputs.result == 'true' }}

concurrency:
  group: ${{ github.event_name != 'push' && format('{0}-{1}', github.repository_id, github.ref_name || github.run_id) }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

# Use PAT instead of GITHUB_TOKEN to cause semantic-release to trigger tag pipeline when tag is created.
# 'Fine-grained token' repo permissions: Contents

jobs:
  check-changed:
    name: Check Changed Files
    if: github.event_name == 'push' && ! startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/check-changed.yaml
    with:
      paths: ${{ inputs.paths }}
      ignore-authors: ${{ inputs.ignore-authors }}
      ignore-events: ${{ inputs.ignore-events }}

  package-update:
    needs: [check-changed]
    name: Update packages
    if: needs.check-changed.outputs.result == 'true'
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch Publish workflow
        if: ${{ (github.event.head_commit.author.name != 'semantic-release-bot' && github.event.head_commit.author.name != 'github-actions[bot]') && !startsWith(github.event.head_commit.message, 'chore(release):') }}
        uses: stairwaytowonderland/simple-workflow-dispatch@v1
        with:
          workflow: ci.yaml
