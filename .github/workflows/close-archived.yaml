name: 🗃️ Manage Dependencies PRs

on:
  # schedule:
  #   - cron: '0 6 * * *'
  workflow_call:
    inputs:
      dry-run:
        description: 'Dry run mode'
        required: false
        type: boolean
        default: true
    secrets:
      github-token:
        description: 'GitHub token with repo access'

permissions:
  contents: read

jobs:
  fetch-archived:
    name: Fetch issues in archived repositories
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.fetch-archived.outputs.repos }}
      count: ${{ steps.fetch-archived.outputs.count }}
    steps:
      - name: Authenticate with GitHub token
        id: auth-token
        uses: stairwaytowonderland/actions/.github/actions/auth-token-action@v1
        with:
          # github-token: ${{ secrets.github-token }}
          app-private-key: ${{ secrets.ORG_PROJECT_MGMT_PRIVATE_KEY }}
          app-client-id: ${{ vars.ORG_PROJECT_MGMT_APP_ID }}
          repo-owner: ${{ github.repository_owner }}

      # - name: Authenticate with GitHub token
      #   id: auth-token
      #   uses: actions/create-github-app-token@v3
      #   with:
      #     client-id: ${{ vars.ORG_PROJECT_MGMT_APP_ID }}
      #     private-key: ${{ secrets.ORG_PROJECT_MGMT_PRIVATE_KEY }}
      #     owner: ${{ github.repository_owner }}
      #     # repositories: ${{ github.repository }}

      - name: Fetch Archived Repositories
        id: fetch-archived
        uses: stairwaytowonderland/actions/.github/actions/fetch-archived-action@v1
        with:
          github-token: ${{ steps.auth-token.outputs.token }}

  # verify:
  #   name: Verify fetched data
  #   runs-on: ubuntu-latest
  #   needs: fetch-archived
  #   env:
  #     REPOS: ${{ needs.fetch-archived.outputs.repos }}
  #     COUNT: ${{ needs.fetch-archived.outputs.count }}
  #     GREATER_THAN_ZERO: ${{ needs.fetch-archived.outputs.count > 0 }}
  #   steps:
  #     - name: Print fetched archived repositories
  #       run: |
  #         echo "Repos: $REPOS"
  #         echo "Count: $COUNT ($COUNT > 0: $GREATER_THAN_ZERO)"

  close-issues:
    name: Close issues in archived repositories
    runs-on: ubuntu-latest
    needs: fetch-archived
    if: needs.fetch-archived.outputs.count > 0
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.fetch-archived.outputs.repos) }}
    steps:
      - name: Authenticate with GitHub token
        id: auth-token
        uses: stairwaytowonderland/actions/.github/actions/auth-token-action@v1
        with:
          github-token: ${{ secrets.github-token }}
          app-private-key: ${{ secrets.ORG_PROJECT_MGMT_PRIVATE_KEY }}
          app-client-id: ${{ vars.ORG_PROJECT_MGMT_APP_ID }}

      - name: Process items for ${{ matrix.repo.name }}
        uses: actions/github-script@v9
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          REPO_NAME: ${{ matrix.name }}
          ORG_NAME: ${{ matrix.org }}
        with:
          github-token: ${{ steps.auth-token.outputs.token }}
          script: |
            const repo = process.env.REPO_NAME;
            const owner = process.env.ORG_NAME;
            const isDryRun = process.env.DRY_RUN === 'true';

            const summaryClosed = [];
            const summaryErrors = [];
            const items = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open'
            });

            core.info(`ℹ️ Found ${items.length} open items in ${repo}`);

            if (isDryRun) {
              core.info(`👀 Dry run: Would process ${items.length} open items in ${repo}`);
            }

            if (items.length === 0) {
              core.warning(`⚠️ No open items found in ${repo}, skipping...`);
              return;
            }

            try {
              // Unarchive the repository temporarily to close issues and PRs
              if (isDryRun) {
                core.info(`👀 Dry run: Would unarchive ${repo}`);
              } else {
                await github.rest.repos.update({ owner, repo, archived: false });
                core.info(`📂 Temporarily unarchived ${repo}`);
              }

              // Safely handle all items sequentially on this single runner
              for (const item of items) {
                const isPR = !!item.pull_request;
                const type = isPR ? 'PR' : 'Issue';

                if (isDryRun) {
                  core.info(`👀 Dry run: Would close ${type} #${item.number}: "${item.title}"`);
                  continue;
                }

                if (isPR) {
                  await github.rest.pulls.update({ owner, repo, pull_number: item.number, state: 'closed' });
                  core.info(`✅ Closed PR #${item.number}`);
                  summaryClosed.push(`PR #${item.number}: "${item.title}"`);
                  summaryClosed.push(`- **${repo}**: Closed PR [#${item.number}](${item.html_url})`);
                } else {
                  await github.rest.issues.update({ owner, repo, issue_number: item.number, state: 'closed', state_reason: 'not_planned' });
                  core.info(`✅ Closed Issue #${item.number}`);
                  summaryClosed.push(`Issue #${item.number}: "${item.title}"`);
                  summaryClosed.push(`- **${repo}**: Closed Issue [#${item.number}](${item.html_url})`);
                }
              }
            } catch (error) {
              core.error(`❌ Error processing item: ${error.message}`);
              summaryErrors.push(`- **${repo}**: ${error.message}`);
            } finally {
              // Lock the archive back down safely
              try {
                if (isDryRun) {
                  core.info(`👀 Dry run: Would re-archive ${repo}`);
                } else {
                  await github.rest.repos.update({ owner, repo, archived: true });
                  core.info(`🗂️ Safely re-archived ${repo}`);
                }
              } catch (error) {
                core.setFailed(`❌ Error re-archiving repository ${repo}: ${error.message}`);
                return;
              }
            }

            await core.summary
              .addHeading(`Archived Repository Issue Cleanup Summary for ${repo}`)
              .addText(`**Execution Mode:** ${isDryRun ? 'Dry Run' : 'Actual Run'}`)
              .addText(`Target Owner context evaluated as: **${owner}**`)
              .addHeading(isDryRun ? 'PRs and Issues Identified for Closing' : 'Closed PRs and Issues', 3)
              .addText(summaryClosed.length > 0 ? summaryClosed.join('\n') : 'No open issues found in archived repositories.')
              .addHeading('Errors Encountered', 3)
              .addText(summaryErrors.length > 0 ? summaryErrors.join('\n') : 'None.')
              .write();
