name: Reusable Search-Driven Archived Repo Cleanup

on:
  workflow_call:
    inputs:
      dry-run:
        description: 'Dry Run (Log actions without closing items or modifying archives)'
        type: boolean
        default: true
      fail-on-error:
        description: 'Whether to fail the workflow if any errors occur during processing'
        type: boolean
        default: true
    secrets:
      github-token:
        description: 'PAT or GitHub App Installation Token with repo permissions'
        required: true
    outputs:
      repos:
        description: 'JSON array of repositories containing open items'
        value: ${{ jobs.search-and-close.outputs.repos }}
      count:
        description: 'Number of repositories containing open items'
        value: ${{ jobs.search-and-close.outputs.count }}
      targets:
        description: 'JSON object of repositories and their open items'
        value: ${{ jobs.search-and-close.outputs.targets }}
      results:
        description: 'JSON array of all open issues and PRs found in archived repositories'
        value: ${{ jobs.search-and-close.outputs.results }}
      updated-repos:
        description: 'JSON array of repositories that were updated (unarchived and re-archived)'
        value: ${{ jobs.search-and-close.outputs.updated-repos }}
      updated-count:
        description: 'Number of repositories that were updated (unarchived and re-archived)'
        value: ${{ jobs.search-and-close.outputs.updated-count }}
      failed-repos:
        description: 'JSON array of repositories that failed to be processed'
        value: ${{ jobs.search-and-close.outputs.failed-repos }}
      failed-count:
        description: 'Number of repositories that failed to be processed'
        value: ${{ jobs.search-and-close.outputs.failed-count }}

jobs:
  search-and-close:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.process-items.outputs.repos }}
      count: ${{ steps.process-items.outputs.count }}
      results: ${{ steps.process-items.outputs.results }}
      targets: ${{ steps.process-items.outputs.targets }}
      updated-repos: ${{ steps.process-items.outputs.updated-repos }}
      updated-count: ${{ steps.process-items.outputs.updated-count }}
      failed-repos: ${{ steps.process-items.outputs.failed-repos }}
      failed-count: ${{ steps.process-items.outputs.failed-count }}
    steps:
      - name: Authenticate with GitHub token
        id: auth-token
        uses: stairwaytowonderland/actions/.github/actions/auth-token-action@v1
        with:
          github-token: ${{ secrets.github-token }}
          app-private-key: ${{ secrets.ORG_PROJECT_MGMT_PRIVATE_KEY }}
          app-client-id: ${{ vars.ORG_PROJECT_MGMT_APP_ID }}

      - name: Find and Close Items in Archived Repos
        id: process-items
        uses: actions/github-script@v9
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        with:
          github-token: ${{ steps.auth-token.outputs.token }}
          script: |
            const orgName = context.repo.owner;
            const isDryRun = process.env.DRY_RUN === 'true';
            const failOnError = process.env.FAIL_ON_ERROR === 'true';

            // An array to hold flat objects for the matrix output
            const repoData = [];
            // An object to hold repositories and their open items
            const targets = {};
            // An array to hold repositories that were updated (unarchived and re-archived)
            const updatedRepos = [];
            // An array to hold repositories that failed to be processed
            const failedRepos = [];

            const logMessage = (message = '', isWarning = false) => {
              if (message.trim() === '') return;
              if (isWarning) {
                core.warning(message);
              } else {
                core.info(message);
              }
            };

            const logOutput = (message = '') => {
              logMessage(message, failedRepos.length > 0);

              core.info(`Targets: ${JSON.stringify(targets)}`);
              core.info(`repoData: ${JSON.stringify(repoData)}`);

              core.setOutput('targets', JSON.stringify(targets));
              core.setOutput('repos', JSON.stringify(repoData));
              core.setOutput('count', repoData.length);

              core.setOutput('updated-repos', JSON.stringify(updatedRepos));
              core.setOutput('updated-count', updatedRepos.length);
              core.setOutput('failed-repos', JSON.stringify(failedRepos));
              core.setOutput('failed-count', failedRepos.length);
            };

            const logOutputAndFail = (message = '') => {
              logOutput();
              core.setFailed(message);
            };

            if (isDryRun) {
              core.info("👀 DRY RUN ENABLED: No changes will be saved to GitHub.");
            }

            if (failOnError) {
              core.info("💀 Fail-on-error mode enabled: The workflow will fail on the first error encountered.");
            }

            // 1. Query for open issues/PRs in archived repositories
            const q = `org:${orgName} is:open archived:true`;
            core.info(`Searching with query: "${q}"`);

            const searchResults = await github.paginate(
              github.rest.search.issuesAndPullRequests,
              { q, per_page: 100 }
            );

            core.info(`Found ${searchResults.length} open items across archived repositories.`);
            core.setOutput('results', JSON.stringify(searchResults));

            if (searchResults.length === 0) {
              logOutput("No open issues or PRs found in archived repositories.");
              return;
            }

            // 2. Parse search results and group items by repository for sequential processing
            for (const item of searchResults) {
              const urlPath = new URL(item.repository_url).pathname;
              const repoName = urlPath.split('/').pop();
              const isPR = Object.hasOwn(item, 'pull_request');

              if (!targets[repoName]) {
                targets[repoName] = [];
              }
              targets[repoName].push({ number: item.number, isPR, title: item.title, html_url: item.html_url });
            }

            // 3. Process each repository sequentially (only if not a dry run)
            for (const [repoName, items] of Object.entries(targets)) {
              core.info(`\n📦 Repository: ${repoName} (${items.length} open items)`);

              // Construct the flat object requested for the downstream matrix output
              repoData.push({
                orgName,
                name: repoName,
                url: `https://github.com/${orgName}/${repoName}`,
                items: items
              });

              if (isDryRun) {
                for (const item of items) {
                  const type = item.isPR ? 'PR' : 'Issue';
                  core.info(`  [DRY RUN] Would close ${type} #${item.number}: "${item.title}"`);
                }
                continue;
              }

              try {
                // Temporarily unarchive to allow mutation
                await github.rest.repos.update({ owner: orgName, repo: repoName, archived: false });
                core.info(`  📂 Temporarily unarchived ${repoName}`);

                for (const item of items) {
                  if (item.isPR) {
                    await github.rest.pulls.update({
                      owner: orgName, repo: repoName, pull_number: item.number, state: 'closed'
                    });
                    core.info(`  ✅ Closed PR #${item.number}`);
                  } else {
                    await github.rest.issues.update({
                      owner: orgName, repo: repoName, issue_number: item.number, state: 'closed', state_reason: 'not_planned'
                    });
                    core.info(`  ✅ Closed Issue #${item.number}`);
                  }
                }

                updatedRepos.push(repoName);
              } catch (error) {
                failedRepos.push({ name: repoName, stage: 'processing', error: error.message });
                if (!failOnError) {
                  core.error(`  ❌ Error processing ${repoName}: ${error.message}`);
                } else {
                  logOutputAndFail(`  ❌ Error processing ${repoName}: ${error.message}`);
                  return;
                }
              } finally {
                // Relock the repository data by re-archiving it
                try {
                  await github.rest.repos.update({ owner: orgName, repo: repoName, archived: true });
                  core.info(`  🗂️ Safely re-archived ${repoName}`);
                } catch (error) {
                  failedRepos.push({ name: repoName, stage: 're-archiving', error: error.message });
                  if (!failOnError) {
                    core.error(`  ❌ Error re-archiving ${repoName}: ${error.message}`);
                  } else {
                    logOutputAndFail(`  ❌ Error re-archiving ${repoName}: ${error.message}`);
                    return;
                  }
                }
              }
            }
            if (failedRepos.length > 0) {
              logOutput(`⚠️ Completed with errors. Updated ${updatedRepos.length} repositories, failed to process ${failedRepos.length} repositories.`);
            } else {
              logOutput(`✅ Completed successfully. Updated ${updatedRepos.length} repositories, failed to process ${failedRepos.length} repositories.`);
            }
