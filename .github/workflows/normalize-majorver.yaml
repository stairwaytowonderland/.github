name: Normalize Major Version Tag

on:
  workflow_call:
    inputs:
      dry-run:
        description: 'Whether to perform a dry run.'
        type: boolean
        default: false
      ref:
        description: 'The git reference to normalize.'
        type: string
    secrets:
      github-token:
        description: 'GitHub Personal Access Token with repo scope for creating releases.'

permissions:
  contents: read

# Use PAT instead of GITHUB_TOKEN to cause semantic-release to trigger tag pipeline when tag is created.
# 'Fine-grained token' repo permissions: Contents

jobs:
  normalize-majorver:
    name: 🔖 Normalize Major Version Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: stairwaytowonderland/normalize-majorver@v1
        with:
          github-token: ${{ secrets.github-token || github.token }}
          dry-run: ${{ inputs.dry-run }}
          ref: ${{ inputs.ref }}
