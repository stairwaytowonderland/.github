name: 🗂️ Add dependency PRs to board

on:
  workflow_call:
    inputs:
      dry-run:
        description: 'Dry run mode'
        type: boolean
        default: true
    secrets:
      github-token:
        description: 'GitHub token with repo access'

permissions:
  contents: read

jobs:
  add-to-project:
    name: Add pull requests to project
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate with GitHub token
        id: auth-token
        uses: stairwaytowonderland/actions/.github/actions/auth-token-action@v1
        with:
          github-token: ${{ secrets.github-token }}
          app-private-key: ${{ secrets.ORG_PROJECT_MGMT_PRIVATE_KEY }}
          app-client-id: ${{ vars.ORG_PROJECT_MGMT_APP_ID }}
          repo-owner: ${{ github.repository_owner }}

      - uses: stairwaytowonderland/add-to-project@v1
        with:
          dry-run: ${{ inputs.dry-run }}
          project-url: https://github.com/orgs/${{ github.repository_owner }}/projects/5
          github-token: ${{ steps.auth-token.outputs.token }}
          labeled: dependencies
