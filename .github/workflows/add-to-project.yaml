name: Add dependency PRs to board

on:
  workflow_call:
    inputs:
      dry-run:
        description: 'Dry run mode'
        type: boolean
        default: true
    secrets:
      github-token:
        description: 'GitHub token with repo access'

permissions:
  contents: read

jobs:
  fetch-repos:
    name: Fetch repositories
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.fetch-repos.outputs.repos }}
      count: ${{ steps.fetch-repos.outputs.count }}
    steps:
      - name: Authenticate with GitHub token
        id: auth-token
        uses: stairwaytowonderland/actions/.github/actions/auth-token-action@v1
        with:
          # github-token: ${{ secrets.github-token }}
          app-private-key: ${{ secrets.ORG_PROJECT_MGMT_PRIVATE_KEY }}
          app-client-id: ${{ vars.ORG_PROJECT_MGMT_APP_ID }}
          repo-owner: ${{ github.repository_owner }}

      # - name: Authenticate with GitHub token
      #   id: auth-token
      #   uses: actions/create-github-app-token@v3
      #   with:
      #     client-id: ${{ vars.ORG_PROJECT_MGMT_APP_ID }}
      #     private-key: ${{ secrets.ORG_PROJECT_MGMT_PRIVATE_KEY }}
      #     owner: ${{ github.repository_owner }}
      #     # repositories: ${{ github.repository }}

      - name: Fetch Archived Repositories
        id: fetch-repos
        uses: stairwaytowonderland/actions/.github/actions/fetch-owner-repos-action@v1
        with:
          github-token: ${{ steps.auth-token.outputs.token }}

  add-to-project:
    name: Add pull requests to project
    runs-on: ubuntu-latest
    needs: fetch-repos
    if: needs.fetch-repos.outputs.count > 0
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.fetch-repos.outputs.repos) }}
    steps:
      - name: Authenticate with GitHub token
        id: auth-token
        uses: stairwaytowonderland/actions/.github/actions/auth-token-action@v1
        with:
          github-token: ${{ secrets.github-token }}
          app-private-key: ${{ secrets.ORG_PROJECT_MGMT_PRIVATE_KEY }}
          app-client-id: ${{ vars.ORG_PROJECT_MGMT_APP_ID }}
          repo-name: ${{ matrix.name }}
          repo-owner: ${{ matrix.owner }}

      - uses: stairwaytowonderland/add-to-project@v1
        with:
          dry-run: ${{ inputs.dry-run }}
          project-url: https://github.com/orgs/${{ github.repository_owner }}/projects/5
          github-token: ${{ steps.auth-token.outputs.token }}
          labeled: dependencies
          repo: ${{ matrix.owner }}/${{ matrix.name }}
