      #     CHECKOV_VERSION: ${{ inputs.checkov-version }}
      #     CHECKOV_FILE_NAME: ${{ inputs.checkov-file-name }}
      #   run: |
      #     # 1. Dynamically upgrade or pin Checkov to your exact required version on the fly
      #     if [ -n "${CHECKOV_VERSION}" ]; then
      #       pip install --no-cache-dir --break-system-packages checkov==${CHECKOV_VERSION}
